[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    timeout: mark test with a maximum wall-clock timeout
    slow: mark test as slow-running (skip with -m "not slow")
    integration: mark test as an integration test requiring live network / browser
    e2e: mark test as an end-to-end test requiring a running BEACON backend

filterwarnings =
    ignore::DeprecationWarning:gotrue
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:bs4
    ignore::pytest.PytestUnknownMarkWarning
