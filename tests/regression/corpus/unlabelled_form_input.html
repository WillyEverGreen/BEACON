<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Golden Test: Unlabelled Form Input</title>
</head>
<body>
  <main>
    <h1>Sign Up</h1>
    <form action="/submit" method="POST">
      <span>Email:</span>
      <input type="text" name="email" id="email-field">
      <button type="submit">Submit</button>
    </form>
  </main>
</body>
</html>
