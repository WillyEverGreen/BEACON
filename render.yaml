services:
  - type: web
    name: beacon-api
    runtime: docker
    region: oregon
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    healthCheckPath: /health
    
    autoDeploy: true
    
    envVars:
      # Environment
      - key: ENVIRONMENT
        value: production
      
      # LLM Configuration (set in Render dashboard)
      - key: NVIDIA_API_KEY
        sync: false
      - key: LLM_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      
      # Supabase (set in Render dashboard)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      
      # API Keys (generate secure random values)
      - key: BOOTSTRAP_VIEWER_API_KEY
        generateValue: true
      - key: BOOTSTRAP_AUDITOR_API_KEY
        generateValue: true
      - key: BOOTSTRAP_ADMIN_API_KEY
        generateValue: true
      
      # CORS Configuration (set to your Vercel domain)
      - key: BACKEND_CORS_ORIGINS
        value: http://localhost:3000
      
      # Security Configuration
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: RATE_LIMIT_PER_HOUR
        value: 1000
      - key: MAX_REQUEST_SIZE_MB
        value: 10
      
      # Backend Configuration
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 8000
      - key: BACKEND_LOG_LEVEL
        value: INFO
      
      # Authentication
      - key: AUTH_ENABLED
        value: true
      
      # Feature Flags
      - key: BEACON_AI_ENABLED
        value: true
      
      # Vector Store
      - key: VECTOR_STORE
        value: chromadb
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
      
      # Logs
      - key: LOGS_DIR
        value: /app/logs
      
      # Scan Limits
      - key: MAX_SCAN_GLOBAL_CAP
        value: 80
      - key: MAX_CONCURRENT_SITE_AUDITS
        value: 3
      - key: DASHBOARD_DEEP_SCAN_MAX_PAGES
        value: 12
      - key: DASHBOARD_MAX_SCAN_MAX_PAGES
        value: 25
