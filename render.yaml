services:
  - type: web
    name: beacon-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: NVIDIA_API_KEY
        sync: false
      - key: LLM_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BOOTSTRAP_VIEWER_API_KEY
        sync: false
      - key: BOOTSTRAP_AUDITOR_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://frontend-seven-phi-64.vercel.app
      - key: BACKEND_CORS_ORIGINS
        value: https://frontend-seven-phi-64.vercel.app
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: RATE_LIMIT_PER_HOUR
        value: 1000
      - key: MAX_REQUEST_SIZE_MB
        value: 10
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: 8000
      - key: BACKEND_LOG_LEVEL
        value: INFO
      - key: AUTH_ENABLED
        value: true
      - key: BEACON_AI_ENABLED
        value: true
      - key: VECTOR_STORE
        value: chromadb
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
      - key: LOGS_DIR
        value: /app/logs
      - key: MAX_SCAN_GLOBAL_CAP
        value: 80
      - key: MAX_CONCURRENT_SITE_AUDITS
        value: 3
      - key: DASHBOARD_DEEP_SCAN_MAX_PAGES
        value: 12
      - key: DASHBOARD_MAX_SCAN_MAX_PAGES
        value: 25
