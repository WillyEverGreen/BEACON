version: '3.8'

services:
  # Backend API
  beacon-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/beacon
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - BOOTSTRAP_VIEWER_API_KEY=dev_viewer_key_12345
      - BOOTSTRAP_AUDITOR_API_KEY=dev_auditor_key_67890
      - BOOTSTRAP_ADMIN_API_KEY=dev_admin_key_abcdef
      - BACKEND_CORS_ORIGINS=http://localhost:3000
      - AUTH_ENABLED=true
      - BEACON_AI_ENABLED=true
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database (for local development, use Supabase in production)
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=beacon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
