name: BEACON Self-Audit (Lighthouse CI)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run nightly at 03:00 UTC to catch performance regressions.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  lighthouse-ci:
    name: Lighthouse Audit — BEACON Platform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start BEACON server (background)
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          # Wait until server is ready (up to 30 seconds)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'sqlite:///./beacon_test.db' }}
          SECRET_KEY: ci-test-secret-key

      - name: Run Lighthouse CI
        run: lhci autorun --config=.lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results-${{ github.sha }}
          path: .lighthouseci/
          retention-days: 14
